<style>
:root{--bg:#14161a;--cd:#1f2228;--tx:#f1ede4;--mu:#a3a8b3;--ln:#2e333c;--ac:#f2b05e;--on:#1a1305;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;touch-action:manipulation}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto;padding:12px 20px 0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 6px}h1{font-size:34px;line-height:1.1;margin:2px 0 0;font-weight:700}
.tm{font-size:13px;color:var(--mu)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--cd);color:var(--tx);display:grid;place-items:center;padding:0}
.it{position:relative;padding-left:30px;margin-top:14px}.it::before{content:'';position:absolute;left:7px;top:0;bottom:-14px;width:2px;background:var(--ln)}
.nd{position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--mu)}.nd.d{background:var(--ac);border-color:var(--ac)}.nd.c{border-color:var(--ac);box-shadow:0 0 0 4px rgba(242,176,94,.22)}
.cd{position:relative;background:var(--cd);border-radius:16px;padding:14px 16px}.cd.w{background:none;border:2px dashed #3a404b}.cd.cur{border:2px solid var(--ac)}
.mn{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:0 36px 0 0;cursor:pointer}.mn b{display:block;font-weight:600;margin-top:2px}.ok{color:var(--ac);font-size:14px;font-weight:600;display:block;margin-top:6px}
.kb{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;color:var(--mu);display:grid;place-items:center;padding:0}
.go{margin-top:12px;width:100%;min-height:48px;border-radius:12px;border:0;background:var(--ac);color:var(--on);font-size:17px;font-weight:700;cursor:pointer}
.nw{margin-top:22px;min-height:52px;border-radius:14px;border:2px solid #3a404b;background:none;color:var(--tx);font-size:17px;font-weight:600;width:100%;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9}.sh{max-height:92%;overflow-y:auto;background:#1a1d22;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.gb{width:36px;height:5px;border-radius:3px;background:#3a404b;margin:0 auto 14px}.sh h1{font-size:28px}
.in{display:block;width:100%;background:var(--cd);border:0;border-radius:14px;padding:12px 16px;min-height:50px;color:var(--tx);font-size:17px;margin-top:8px}textarea.in{font-size:14px;height:80px}
.tp{background:#2e333c;border:0;border-radius:8px;padding:6px 10px;color:var(--tx);font-size:17px;min-height:36px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.ch button{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--cd);color:var(--tx);font-size:16px;cursor:pointer}.ch button.on{background:var(--ac);color:var(--on);font-weight:700}.dys button{min-width:44px;padding:0 10px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cd);border-radius:14px;padding:10px 16px;margin-top:20px;min-height:56px}
.sw{width:51px;height:31px;border-radius:16px;background:#3a404b;border:0;position:relative;padding:0;flex:none}.sw span{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:var(--bg);transition:transform .2s}.sw.on{background:var(--ac)}.sw.on span{transform:translateX(20px)}
.sv{display:block;margin-top:18px;min-height:54px;border-radius:14px;border:0;background:var(--ac);color:var(--on);font-size:17px;font-weight:700;width:100%;cursor:pointer}.sv.g2{background:var(--cd);color:var(--tx)}.sv.dg{color:#ff9d8d}
.wr{padding:12px 0;border-top:1px solid var(--ln)}.dt{display:flex;gap:6px;margin-top:8px;align-items:center}.dt i{width:14px;height:14px;border-radius:50%;border:2px solid #3a404b}.dt i.d{background:var(--ac);border-color:var(--ac)}.dt i.x{border:0;background:var(--ln);width:6px;height:6px;margin:0 4px}
#tt{width:max-content;position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-220px);background:#2a2e36;color:var(--tx);font-size:15px;font-weight:600;padding:12px 18px;border-radius:14px;z-index:20;max-width:90%;text-align:center;transition:transform .25s;pointer-events:none}#tt.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#tt,.sw span{transition:none}}
</style></head><body><main id="m"></main><div id="tt"></div><div id="s"></div>
<script>
window.onerror=(m,u,l)=>{if(!l)return;const b=document.createElement('div');b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:30;background:#f2b05e;color:#1a1305;padding:10px;border-radius:12px;font-size:13px';b.textContent='Ошибка: '+m+' (строка '+l+'). Нажми, чтобы закрыть.';b.onclick=()=>b.remove();document.body.appendChild(b)};
const VER=4;
(function(){fetch(location.pathname+'?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VER=(\d+)/);if(m&&+m[1]!==VER){const n=Date.now();let l=0;try{l=+localStorage.getItem('wr')||0}catch(e){}if(n-l>60000){try{localStorage.setItem('wr',n)}catch(e){}location.replace(location.pathname+'?u='+n)}}}).catch(()=>{})})();
const KEY='wife3',DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],PH=['Отлично!','Так держать','Приятно видеть','Молодец'],PRE=['Проснулась','Пришла с работы','Уложила детей','Почистила зубы','Села в транспорт'];
const BARS='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 19v-8M12 19V5M18 19v-6"/></svg>',KEB='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5.5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="18.5" r="1.8"/></svg>';
const D=()=>({a:[{id:1,a:'Проснулась',d:'растяжка 10 минут',t:'09:30',r:0,w:[0,1,2,3,4,5,6]},{id:2,a:'Переоделась',d:'велосипед 20 минут',t:'19:30',r:0,w:[0,2,4]},{id:3,a:'Позавтракали',d:'настолки с детьми',t:'12:00',r:0,w:[5,6]},{id:4,a:'Поужинала',d:'один шаг по своему делу',t:'21:00',r:0,w:[1,3,6]},{id:5,a:'Легла',d:'10 страниц книги',t:'22:30',r:0,w:[0,1,2,3,4,5,6]}],d:{},wn:{},ws:'11:00',we:'19:00',wd:[0,1,2,3,4],n:6,v:4});
let S,cu={};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.a))S=D();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),hm=t=>t.replace(/^0/,'');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dow=d=>(new Date(d+'T00:00:00').getDay()+6)%7;
const wk=(o=0)=>{const d=new Date(),k=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-k+i-7*o);return iso(x)})};
function seg(t,w){if(S.wd.includes(w)){if(t<S.ws)return'До работы';if(t<S.we)return'Во время работы';return t<'21:30'?'После работы':'Перед сном'}return t>='21:30'?'Перед сном':t<'12:00'?'Утро':t<'18:00'?'День':'Вечер'}
function today(){const t=iso(new Date()),w=dow(t),dn=S.d[t]||[],L=S.a.filter(x=>x.w.includes(w)).sort((p,q)=>p.t<q.t?-1:1),nx=L.find(x=>!dn.includes(x.id)),
 I=L.map(x=>({t:x.t,x})).concat(S.wd.includes(w)?[{t:S.ws,w:1}]:[]).sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:p.w?-1:1);
 let day=new Date().toLocaleDateString('ru-RU',{weekday:'long'});day=day[0].toUpperCase()+day.slice(1);
 return`<div class="hd"><div><div class="tm">${day}</div><h1>Сегодня</h1></div><button class="ib" onclick="oW()" aria-label="Неделя и настройки">${BARS}</button></div>`+
 (I.length?I.map(i=>{if(i.w)return`<div class="it"><i class="nd"></i><div class="cd w"><div class="tm">Работа · ${hm(S.ws)}–${hm(S.we)}</div></div></div>`;
  const x=i.x,ok=dn.includes(x.id),cur=x===nx;
  return`<div class="it"><i class="nd ${ok?'d':cur?'c':''}"></i><div class="cd ${cur?'cur':''}"><button class="mn" onclick="tg(${x.id})"><span class="tm">${seg(x.t,w)} · ${hm(x.t)}</span><b>${esc(x.a)} → ${esc(x.d)}</b>${ok?'<span class="ok">Готово</span>':''}</button><button class="kb" onclick="oA(${x.id})" aria-label="Изменить">${KEB}</button>${cur?`<button class="go" onclick="tg(${x.id})">Сделала</button>`:''}</div></div>`}).join(''):`<div class="it"><i class="nd"></i><div class="cd"><div class="tm">На сегодня привязок нет</div></div></div>`)+
 `<button class="nw" onclick="oA(0)">+ Новая привязка</button>`}
function render(){document.getElementById('m').innerHTML=today()}
function sheet(h){document.getElementById('s').innerHTML=h?`<div class="ov" onclick="if(event.target==this)cs()"><div class="sh"><div class="gb"></div>${h}</div></div>`:''}
const cs=()=>sheet('');
function toast(m){const e=document.getElementById('tt');e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2400)}
function tg(id){const t=iso(new Date()),l=S.d[t]||(S.d[t]=[]),i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);save();render();if(i<0)toast(PH[Math.floor(Math.random()*PH.length)])}
function oA(id){const x=S.a.find(y=>y.id==id);cu=x?JSON.parse(JSON.stringify(x)):{id:0,a:'',d:'',t:'19:30',r:1,w:[0,1,2,3,4,5,6]};rA()}
function rA(){sheet(`<h1>${cu.id?'Привязка':'Новая привязка'}</h1><div class="tm">После чего это случается у тебя?</div><input class="in" id="fa" maxlength="40" placeholder="Например: пришла с работы" value="${esc(cu.a)}"><div class="ch">${PRE.map((p,j)=>`<button class="${cu.a==p?'on':''}" onclick="pp(${j})">${p}</button>`).join('')}</div><div class="tm" style="margin-top:24px">Тогда я…</div><input class="in" id="fd" maxlength="50" placeholder="Например: велосипед 20 минут" value="${esc(cu.d)}"><div class="tm" style="margin-top:24px">По каким дням</div><div class="ch dys" style="margin-top:8px">${DN.map((n,i)=>`<button class="${cu.w.includes(i)?'on':''}" onclick="pd(${i})">${n}</button>`).join('')}</div><div class="rw"><span>Время</span><input type="time" class="tp" id="ft" value="${cu.t}"></div><div class="rw" style="margin-top:12px"><span>Напомнить</span><button class="sw ${cu.r?'on':''}" aria-pressed="${!!cu.r}" aria-label="Напоминание" onclick="pr()"><span></span></button></div><button class="sv" onclick="sA()">Сохранить</button>${cu.id?'<button class="sv g2 dg" onclick="dA()">Удалить</button>':''}`)}
function rd(){cu.a=document.getElementById('fa').value;cu.d=document.getElementById('fd').value;cu.t=document.getElementById('ft').value||cu.t}
function pp(j){rd();cu.a=PRE[j];rA()}function pr(){rd();cu.r=cu.r?0:1;rA()}
function pd(i){rd();const x=cu.w.indexOf(i);x<0?cu.w.push(i):cu.w.splice(x,1);cu.w.sort();rA()}
function sA(){rd();cu.a=cu.a.trim();cu.d=cu.d.trim();if(!cu.a||!cu.d||!cu.w.length){toast('Заполни «после чего», «тогда я» и выбери дни');return}
 if(cu.id){const i=S.a.findIndex(y=>y.id==cu.id);S.a[i]=cu}else{cu.id=S.n++;S.a.push(cu)}save();cs();render()}
function dA(){S.a=S.a.filter(y=>y.id!=cu.id);save();cs();render()}
function wd(i){const x=S.wd.indexOf(i);x<0?S.wd.push(i):S.wd.splice(x,1);save();render();oW()}
function oW(){const W=wk(),P=wk(1),pl=(x,ds)=>ds.filter(d=>x.w.includes(dow(d))),dn=(x,ds)=>pl(x,ds).filter(d=>(S.d[d]||[]).includes(x.id)).length;
 sheet(`<h1>Неделя</h1>${S.a.map(x=>`<div class="wr"><div class="row"><span>${esc(x.a)} → ${esc(x.d)}</span><b>${dn(x,W)} из ${pl(x,W).length}</b></div><div class="dt">${W.map(d=>`<i class="${!x.w.includes(dow(d))?'x':(S.d[d]||[]).includes(x.id)?'d':''}"></i>`).join('')}</div><div class="tm" style="margin-top:6px">прошлая неделя: ${dn(x,P)} из ${pl(x,P).length}</div></div>`).join('')||'<div class="tm">Пока нет привязок</div>'}
<div class="tm" style="margin-top:24px">Что помогло на этой неделе?</div><input class="in" maxlength="80" placeholder="Например: форма готова с вечера" value="${esc(S.wn[W[0]]||'')}" oninput="S.wn['${W[0]}']=this.value;save()">
<div class="tm" style="margin-top:24px">Рабочие часы</div><div class="rw" style="margin-top:8px"><span>С</span><input type="time" class="tp" value="${S.ws}" onchange="S.ws=this.value||S.ws;save();render()"><span>До</span><input type="time" class="tp" value="${S.we}" onchange="S.we=this.value||S.we;save();render()"></div><div class="ch dys" style="margin-top:10px">${DN.map((n,i)=>`<button class="${S.wd.includes(i)?'on':''}" onclick="wd(${i})">${n}</button>`).join('')}</div>
<button class="sv g2" onclick="ics()">Добавить напоминания в Календарь</button><div class="tm" style="margin-top:6px">Только привязки с включённым напоминанием. Откроется Календарь: «Добавить все». Если не открылось, открой приложение в Safari.</div>
<div class="tm" style="margin-top:24px">Копия данных</div><textarea class="in" id="bk"></textarea><div class="ch" style="margin-top:10px"><button onclick="exp()">Сделать копию</button><button onclick="imp()">Восстановить</button></div><div class="tm" style="margin-top:18px;text-align:center">Версия v${VER}</div>`)}
const ie=s=>String(s).replace(/([,;\\])/g,'\\$1');
function icsText(){const now=new Date(),st=iso(now).replace(/-/g,''),BY=['MO','TU','WE','TH','FR','SA','SU'],k=(now.getDay()+6)%7;
 const ev=S.a.filter(x=>x.r).map(x=>{const off=Math.min(...x.w.map(w=>(w-k+7)%7)),d=new Date(now);d.setDate(now.getDate()+off);const s=ie(x.a+' → '+x.d);
 return['BEGIN:VEVENT','UID:a'+x.id+'@okna','DTSTAMP:'+st+'T000000Z','DTSTART:'+iso(d).replace(/-/g,'')+'T'+x.t.replace(':','')+'00','DURATION:PT15M','RRULE:FREQ=WEEKLY;BYDAY='+x.w.map(w=>BY[w]).join(','),'SUMMARY:'+s,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+s,'TRIGGER:PT0S','END:VALARM','END:VEVENT'].join('\r\n')});
 return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//okna//RU','CALSCALE:GREGORIAN'].concat(ev,['END:VCALENDAR']).join('\r\n')}
function ics(){if(!S.a.some(x=>x.r)){toast('Включи напоминание хотя бы у одной привязки');return}const t=icsText(),f=new File([t],'okna.ics',{type:'text/calendar'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else location.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}))}
function exp(){const e=document.getElementById('bk');e.value=JSON.stringify(S);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}}
function imp(){try{const o=JSON.parse(document.getElementById('bk').value);if(!o||!Array.isArray(o.a)||typeof o.d!='object')throw 0;S=o;save();cs();render();alert('Данные восстановлены')}catch(e){alert('Не получилось: вставь в поле текст копии целиком')}}
save();render();
</script></body></html>
