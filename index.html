<style>
:root{--bg:#121416;--card:#1c1f23;--ln:#33383e;--tx:#eceadf;--mu:#9a9f98;--ac:#ffd400;--bad:#ff5a4d;--ok:#5fd394;--warn:#ffd400;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}button,input,select,textarea{font-family:inherit;touch-action:manipulation}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.big{font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;font-weight:700;margin:0}
h2{font-size:22px;margin:22px 0 8px}
.big{font-size:84px;line-height:.9;color:var(--ac)}.hero .mu,.mu.sm{font-family:var(--mono);font-size:13px}.hero .mu{font-size:14px}.mu{color:var(--mu)}.sm{font-size:14px}
.hero{display:flex;align-items:flex-end;gap:12px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin:8px 0}
.hint{border-left:5px solid var(--ac);border-radius:2px 8px 8px 2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-width:40px;height:40px;border-radius:8px;border:2px solid var(--ln);background:none;color:var(--tx);font-weight:700;font-size:18px;line-height:1;cursor:pointer}
.c5,.c4{border-color:var(--ok);color:var(--ok)}.c3{border-color:var(--warn);color:var(--warn)}.c2{border-color:var(--bad);color:var(--bad)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bar button{flex:1;background:none;border:0;color:var(--mu);font-weight:600;font-size:15px;padding:10px 0;cursor:pointer}.bar .on{color:var(--tx);box-shadow:inset 0 -3px var(--ac)}
.btn{background:var(--ac);color:#111;border:0;border-radius:10px;font-weight:700;font-size:16px;padding:12px 16px;cursor:pointer}
.btn.g{background:none;color:var(--tx);border:1px solid var(--ln)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--mu);flex:none;display:grid;place-items:center;font-weight:700}
.dn .box{background:var(--ok);border-color:var(--ok);color:#0b1a10}
.x{margin-left:auto;background:none;border:0;color:var(--mu);font-size:20px;padding:4px 8px}
.sub{border-left:5px solid var(--c)}.sub .chip{min-width:36px;height:36px;font-size:16px}.av{font-weight:700;font-size:20px}.av small{font-size:13px;color:var(--mu);font-weight:400;margin-left:8px}
.t2{--c:var(--bad)}.t3{--c:var(--warn)}.t4,.t5{--c:var(--ok)}
.add{color:var(--ac);border-color:var(--ac)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pick button{padding:14px 8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}
.sh{max-height:90%;overflow-y:auto;background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh .chips .chip{flex:1;height:52px;font-size:22px}
select,input,textarea{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
textarea{height:90px;margin:8px 0}
</style></head><body><main id="m"></main>
<nav class="bar"><button data-t="r">Дорога</button><button data-t="g">Оценки</button><button data-t="d">Сегодня</button></nav>
<div id="s"></div>
<script>
const NAMES=['Английский','Литература','География','История','Информатика','Биология','Физра','Алгебра','Химия','Русский','Физика','Труд','Геометрия'];
const SEED=[[2,4,2,5],[5,2,3,5,3,3],[5,5,2],[4],[4,5],[5],[5,5],[3,3,3,5,3,3,3],[5,4],[3,2],[3,3],[4,5],[5,4,4]];
const GOAL=4+1/3,END=new Date(2026,9,26),KEY='mt1';
let S,tab='r';
const TASKS=()=>[{i:'hw',t:'Сделать уроки'},{i:'rd',t:'Прочитать главы',u:'глав'},{i:'pu',t:'Отжался',u:'раз'},{i:'pw',t:'Подтянулся',u:'раз'},{i:'ho',t:'Помощь по дому'},{i:'pr',t:'Изучить профессию'}];
function def(){let n=0;return{g:Object.fromEntries(NAMES.map((k,i)=>[k,SEED[i].map(v=>({i:++n,v}))])),t:TASKS(),d:{},c:{},h:{},v:3,n}}
function mig(o){if(o.v>=3)return o;o.t=TASKS();o.c=o.c||{};o.h=o.h||{};o.v=3;return o}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.g)S=def();S=mig(S);
const finAvg=()=>sum(NAMES.map(k=>fin(avg(k))))/NAMES.length;
const save=()=>{S.h[iso(new Date())]=+finAvg().toFixed(3);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const f2=x=>x.toFixed(2),sum=a=>a.reduce((x,y)=>x+y,0);
const fin=a=>a<2.6?2:a<3.6?3:a<4.6?4:5;
const vals=k=>S.g[k].map(x=>x.v),avg=k=>sum(vals(k))/vals(k).length;
const pl=n=>{const a=n%100,b=n%10;return a>10&&a<15?'дней':b==1?'день':b>1&&b<5?'дня':'дней'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function plan(a){const n=a.length,s=sum(a);for(let k=1;k<60;k++)if((s+5*k)/(n+k)>=3.6-1e-9)return{k,x:(s+5*k)/(n+k),t:`получить ${k}× «5» подряд`}}
function calc(){const bad=[],good=[];
 NAMES.forEach(k=>{const a=vals(k),av=avg(k);
  if(av<3.6)bad.push({k,av,p:plan(a),f:fin(av)});
  else{const x=(sum(a)+3)/(a.length+1);good.push({k,av,x:x<3.6?x:null})}});
 bad.sort((a,b)=>(a.f-b.f)||(a.p.k-b.p.k)||(a.av-b.av));return{bad,good}}
function scen(k){const a=vals(k),s=sum(a),n=a.length,c=avg(k);return[5,4,3].map(v=>{const x=(s+v)/(n+1);return`${v} → <b class="${x>=3.6?'ok':x>=c?'warn':'bad'}">${f2(x)}</b>`}).join(' · ')}
function streak(){let c=0,d=new Date();if(!(S.d[iso(d)]||[]).includes('hw'))d.setDate(d.getDate()-1);
 while((S.d[iso(d)]||[]).includes('hw')){c++;d.setDate(d.getDate()-1)}return c}
function chart(){const ks=Object.keys(S.h).sort(),pts=[];let last=S.h[ks[0]];
 for(let d=new Date(ks[0]+'T00:00:00');iso(d)<=iso(new Date());d.setDate(d.getDate()+1)){const k=iso(d);if(S.h[k]!=null)last=S.h[k];pts.push({d:k,v:last})}
 const vs=pts.map(p=>p.v).concat(GOAL),lo=Math.floor((Math.min(...vs)-.1)*10)/10,hi=Math.ceil((Math.max(...vs)+.1)*10)/10,W=320,H=130,P=28,n=pts.length;
 const x=i=>n>1?P+i*(W-P-8)/(n-1):W/2,y=v=>H-18-(v-lo)/(hi-lo)*(H-30),lb=p=>p.d.slice(8)+'.'+p.d.slice(5,7);
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График итогового среднего"><line x1="${P}" x2="${W-8}" y1="${y(GOAL)}" y2="${y(GOAL)}" stroke="var(--ac)" stroke-dasharray="4 4"/><text x="0" y="${y(GOAL)+4}" font-size="11" fill="var(--ac)">${f2(GOAL)}</text><text x="0" y="${y(lo)+4}" font-size="11" fill="var(--mu)">${lo.toFixed(1)}</text>${n>1?`<path d="${pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join('')}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round"/>`:''}${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i==n-1?5:3}" fill="var(--ok)"/>`).join('')}${n>1?`<text x="${P}" y="${H-2}" font-size="11" fill="var(--mu)">${lb(pts[0])}</text>`:''}<text x="${W-8}" y="${H-2}" font-size="11" text-anchor="end" fill="var(--mu)">${lb(pts[n-1])}</text></svg>`}
function road(){const{bad,good}=calc(),t0=new Date();t0.setHours(0,0,0,0);const days=Math.max(0,Math.round((END-t0)/864e5));
 const hint=bad.length?`<b>${bad[0].k}:</b> ${bad[0].p.t}. Бери любую возможность получить оценку.`:'Все предметы на четвёрке и выше. Держи планку.';
 const frag=good.filter(g=>g.x);
 return`<div class="hero"><div class="big">${days}</div><div class="mu" style="padding-bottom:6px">${pl(days)} до конца четверти<br>цель: без троек,<br>средний ${f2(GOAL)}</div></div>
<div class="card hint"><div class="mu sm">Сегодня</div>${hint}</div>
<div class="card"><div class="row"><span class="mu sm">Итоговый средний по ${NAMES.length} предметам</span><b class="badge" style="font-size:30px">${f2(finAvg())}</b></div>${chart()}<div class="mu sm">Цель ${f2(GOAL)}: треть предметов на «5», остальные на «4». ${finAvg()>=GOAL-1e-9?'Цель достигнута.':'Осталось +'+f2(GOAL-finAvg())+'.'} Точка на графике добавляется каждый день.</div></div>
<div class="row"><h2>Подтянуть</h2><span class="mu sm">в норме ${good.length} из ${NAMES.length}</span></div>
${bad.length?bad.map(b=>`<div class="card"><div class="row"><b>${b.k}</b><span>${f2(b.av)} <span class="badge ${b.f<3?'bad':'warn'}">итог ${b.f}</span></span></div>
<div>Нужно: ${b.p.t} (будет ${f2(b.p.x)})</div><div class="mu sm">Следующая оценка: ${scen(b.k)}</div></div>`).join(''):'<div class="card ok">Подтягивать нечего.</div>'}
${frag.length?`<h2>Не уронить</h2>${frag.map(g=>`<div class="card row"><b>${g.k}</b><span class="sm mu">${f2(g.av)} · тройка опустит до <b class="warn">${f2(g.x)}</b></span></div>`).join('')}`:''}`}
function grades(){const all=NAMES.flatMap(k=>vals(k)),o=sum(all)/all.length;
 return`<div class="hero"><div class="big">${f2(finAvg())}</div><div class="mu" style="padding-bottom:6px">итоговый средний<br>по всем оценкам ${f2(o)}</div></div>
<div style="margin-top:12px">${NAMES.map(k=>{const av=avg(k),f=fin(av);return`<div class="card sub t${f}"><div class="row"><b>${k}</b><span class="av">${f2(av)}<small>итог ${f}</small></span></div><div class="chips">${S.g[k].map(x=>`<button class="chip c${x.v}" onclick="oG('${k}',${x.i})">${x.v}</button>`).join('')}<button class="chip add" onclick="oN('${k}')" aria-label="Добавить оценку: ${k}">+</button></div></div>`}).join('')}</div>

<h2>Копия данных</h2><div class="card sm mu">Раз в неделю нажимай «Сделать копию» и отправляй текст себе в заметки. Если данные пропадут, вставь текст и нажми «Восстановить».<textarea id="bk"></textarea>
<div class="row"><button class="btn g" onclick="exp()">Сделать копию</button><button class="btn g" onclick="imp()">Восстановить</button></div></div>
<button class="btn fab" onclick="oA()" aria-label="Добавить оценку">+</button>`}
const cnt=(d,i)=>(S.c[d]||{})[i]||0;
function wk(){const d=new Date(),k=(d.getDay()+6)%7,r=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()-k+i);r.push(x)}return r}
function today(){const d=iso(new Date()),dn=S.d[d]||[],c=streak(),W=wk(),ds=W.map(iso),fm=x=>String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0');
 const list=S.t.map(t=>{if(t.u){const n=cnt(d,t.i);return`<div class="chk ${n?'dn':''}" onclick="oC('${t.i}')"><span class="box">${n?'✓':''}</span><span style="flex:1">${t.t}</span><span class="mu sm">сегодня: ${n}</span></div>`}
  return`<div class="chk ${dn.includes(t.i)?'dn':''}" onclick="tg('${t.i}')"><span class="box">${dn.includes(t.i)?'✓':''}</span><span style="flex:1">${t.t}</span></div>`}).join('');
 const pd=W.map(x=>{const y=new Date(x);y.setDate(y.getDate()-7);return iso(y)});
 const dl=(n,p)=>{if(!p)return n?'<span class="ok">новое</span>':'';const x=Math.round((n-p)/p*100);return`<span class="${x>0?'ok':x<0?'bad':''}">${x>0?'+':''}${x}%</span>`};
 const wkr=S.t.map(t=>{let n,p,u;if(t.u){n=sum(ds.map(x=>cnt(x,t.i)));p=sum(pd.map(x=>cnt(x,t.i)));u=t.u}else{n=ds.filter(x=>(S.d[x]||[]).includes(t.i)).length;p=pd.filter(x=>(S.d[x]||[]).includes(t.i)).length;u='дн.'}
  const q=dl(n,p);return`<div style="padding:7px 0"><div class="row"><span>${t.t}</span><b>${n} ${u}</b></div><div class="mu sm">прошлая неделя: ${p} ${u}${q?' · '+q:''}</div></div>`}).join('');
 return`<div class="hero"><div class="big">${c}</div><div class="mu" style="padding-bottom:6px">${pl(c)} подряд<br>с сделанными уроками</div></div>
<div class="card" style="padding-top:2px;padding-bottom:2px">${list}</div>
<h2>За неделю ${fm(W[0])}–${fm(W[6])}</h2><div class="card">${wkr}</div>${new Date().getDay()?'<div class="mu sm">Неделя ещё идёт: к воскресенью цифры вырастут.</div>':''}`}
function oC(i){const t=S.t.find(x=>x.i==i),q=t.u=='раз'?[10,20,30,50]:[1,2,3],d=iso(new Date());
 sheet(`<h2 style="margin-top:0">${esc(t.t)}</h2><div class="mu sm">Сегодня уже: ${cnt(d,i)} ${t.u}. Сколько добавить?</div><div class="chips">${q.map(n=>`<button class="chip" onclick="aC('${i}',${n})">+${n}</button>`).join('')}</div><p><input id="cn" type="number" inputmode="numeric" min="1" placeholder="Своё число"></p><div class="row"><button class="btn" onclick="aC('${i}',+document.getElementById('cn').value)">Добавить</button><button class="btn g" onclick="aC('${i}',0,1)">Обнулить за сегодня</button></div>`)}
function aC(i,n,z){const d=iso(new Date()),c=S.c[d]||(S.c[d]={});if(z)c[i]=0;else{if(!(n>0))return;c[i]=(c[i]||0)+Math.round(n)}save();cs();render()}
function render(){document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 document.getElementById('m').innerHTML='<h1 style="font-size:32px;margin-bottom:4px">Профиль Матвея</h1>'+{r:road,g:grades,d:today}[tab]()}
document.querySelector('.bar').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render();scrollTo(0,0)}};
function sheet(h){document.getElementById('s').innerHTML=h?`<div class="ov" onclick="if(event.target==this)cs()"><div class="sh">${h}</div></div>`:''}
const cs=()=>sheet('');
function tg(i){const d=iso(new Date()),a=S.d[d]||(S.d[d]=[]),x=a.indexOf(i);x<0?a.push(i):a.splice(x,1);save();render()}
function oA(){sheet(`<h2 style="margin-top:0">Какой предмет?</h2><div class="pick">${NAMES.map(k=>`<button onclick="oN('${k}')">${k}</button>`).join('')}</div>`)}
function oN(k){sheet(`<h2 style="margin-top:0">${k}</h2><div class="mu sm">Новая оценка</div><div class="chips">${[2,3,4,5].map(v=>`<button class="chip c${v}" onclick="aN('${k}',${v})">${v}</button>`).join('')}</div>`)}
function aN(k,v){S.g[k].push({i:++S.n,v});save();cs();render()}
function oG(k,i){const x=S.g[k].find(y=>y.i==i);sheet(`<h2 style="margin-top:0">${k}: ${x.v}</h2><div class="mu sm">Пересдал? Выбери новую оценку, старая заменится.</div><div class="chips">${[2,3,4,5].map(v=>`<button class="chip c${v}" onclick="rG('${k}',${i},${v})">${v}</button>`).join('')}</div><p><button class="btn g" onclick="dG('${k}',${i})">Удалить оценку</button></p>`)}
function rG(k,i,v){S.g[k].find(y=>y.i==i).v=v;save();cs();render()}
function dG(k,i){if(S.g[k].length<2){alert('Последнюю оценку предмета удалить нельзя. Её можно заменить, если нажать и выбрать новую.');return}S.g[k]=S.g[k].filter(y=>y.i!=i);save();cs();render()}
function exp(){const e=document.getElementById('bk');e.value=JSON.stringify(S);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}}
function imp(){try{const o=JSON.parse(document.getElementById('bk').value);if(!o.g||!o.t||!NAMES.every(k=>Array.isArray(o.g[k])&&o.g[k].length))throw 0;S=mig(o);save();render();alert('Данные восстановлены')}catch(e){alert('Не получилось: вставь в поле текст копии целиком')}}
save();render();
</script></body></html>
